name: Life OS Behavior Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behavior-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://lifeos:lifeos@127.0.0.1:5432/lifeos_test
      LIFE_OS_ENVIRONMENT: ci
      BEHAVIOR_REPORT_PATH: artifacts/behavior-regression.json
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lifeos -d lifeos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.20.1"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate semantic behavior report
        run: npx tsx scripts/generate-behavior-regression.mts

      - name: Compare against reviewed baseline
        run: npx tsx scripts/compare-behavior-baseline.mts tests/behavior/baseline-v1.json artifacts/behavior-regression.json
