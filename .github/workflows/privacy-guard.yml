name: Life OS Repository Privacy Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.20.1"
          package-manager-cache: false

      - name: Self-test guard rules
        run: node scripts/check-repository-privacy.mjs --self-test

      - name: Scan tracked repository
        run: node scripts/check-repository-privacy.mjs
