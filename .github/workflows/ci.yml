name: Life OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://lifeos:lifeos@127.0.0.1:5432/lifeos_test
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lifeos -d lifeos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.20.1"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test write boundary
        run: npm test

      - name: Test PostgreSQL transaction boundary
        run: npm run test:integration

      - name: Test hosted web configuration boundary
        run: npm run test:deployment --workspace @life-os/web

      - name: Smoke API liveness and database readiness
        run: |
          LIFE_OS_ENVIRONMENT=ci PORT=4010 npm run start:api > /tmp/life-os-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          node <<'NODE'
          const base = 'http://127.0.0.1:4010';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(path, expectedStatus, expectedBody) {
            let lastError;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`);
                const body = await response.json();
                if (response.status === expectedStatus && body.status === expectedBody) return;
                lastError = new Error(`${path} returned ${response.status} ${JSON.stringify(body)}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(250);
            }
            throw lastError ?? new Error(`${path} never became available`);
          }

          await waitFor('/health/live', 200, 'ok');
          await waitFor('/health/ready', 200, 'ready');
          NODE

          kill -TERM "$API_PID"
          wait "$API_PID" || true
          trap - EXIT

          if grep -Eq 'postgres://|lifeos_test|DATABASE_URL' /tmp/life-os-api.log; then
            echo "API log unexpectedly exposed database configuration"
            cat /tmp/life-os-api.log
            exit 1
          fi

      - name: Build hosted web path
        env:
          LIFE_OS_WEB_DEPLOYMENT: live
          NEXT_PUBLIC_LIFE_OS_API_BASE_URL: https://life-os-api-ci.example
          NEXT_PUBLIC_SUPABASE_URL: https://project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_browser_safe_key_123456
          NEXT_PUBLIC_LIFE_OS_DIRECTION_ENABLED: "false"
        run: npm run build:web

      - name: Smoke hosted web liveness and readiness
        env:
          LIFE_OS_WEB_DEPLOYMENT: live
          NEXT_PUBLIC_LIFE_OS_API_BASE_URL: https://life-os-api-ci.example
          NEXT_PUBLIC_SUPABASE_URL: https://project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_browser_safe_key_123456
          NEXT_PUBLIC_LIFE_OS_DIRECTION_ENABLED: "false"
        run: |
          PORT=4020 npm run start --workspace @life-os/web > /tmp/life-os-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          node <<'NODE'
          const base = 'http://127.0.0.1:4020';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitFor(path, expectedStatus, expectedBody) {
            let lastError;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`);
                const body = await response.json();
                if (response.status === expectedStatus && body.status === expectedBody) return body;
                lastError = new Error(`${path} returned ${response.status} ${JSON.stringify(body)}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(250);
            }
            throw lastError ?? new Error(`${path} never became available`);
          }

          await waitFor('/health/live', 200, 'ok');
          const ready = await waitFor('/health/ready', 200, 'ready');
          if (ready.mode !== 'live' || ready.direction !== 'dormant') {
            throw new Error(`unexpected web readiness receipt ${JSON.stringify(ready)}`);
          }
          NODE

          kill -TERM "$WEB_PID"
          wait "$WEB_PID" || true
          trap - EXIT
